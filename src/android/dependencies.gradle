android {
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.13"
    }
}

dependencies {
    implementation "androidx.compose.ui:ui:1.6.4"
    implementation "androidx.compose.compiler:compiler:1.5.13"

    implementation 'com.alviere.android:payments:0.9.28'
    implementation 'com.alviere.android:accounts:0.9.28'
    implementation 'com.alviere.android:alcore:0.9.28'
}